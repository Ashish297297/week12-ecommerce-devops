apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-web
  template:
    metadata:
      labels:
        app: ecommerce-web
    spec:
      containers:
        - name: ecommerce-web
          image: week12-ecommerce-devops-ecommerce-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
